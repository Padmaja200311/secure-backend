services:
  db:
    image: postgres:16
    container_name: secure_backend_db
    environment:
      POSTGRES_DB: secure_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_backend"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: secure_backend_app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/secure_backend
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: